version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cloth_shop_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cloth_shop_erp
      MYSQL_USER: erpuser
      MYSQL_PASSWORD: erppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: cloth_shop_backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cloth_shop_erp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: erpuser
      SPRING_DATASOURCE_PASSWORD: erppassword
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
